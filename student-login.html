
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | CampusConnect 360</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #1e293b;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #64748b;
      text-align: center;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2563eb;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <h1>CampusConnect 360</h1>

    <p class="subtitle">Student Login</p>

    <form id="loginForm">

      <label for="email">Registered Email</label>
      <input
        type="email"
        id="email"
        required
        placeholder="Enter your email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        required
        placeholder="Enter your password"
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <p id="message"></p>

    <p class="register-link">
      New student?
      <a href="student-register.html">Register here</a>
    </p>

  </div>

  <script>

    const API_URL = "http://localhost:5000";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      message.textContent = "";

      try {

        const response = await fetch(
          `${API_URL}/api/student/login`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              student_email: document.getElementById("email").value,
              password: document.getElementById("password").value
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Login failed.");
        }

        sessionStorage.setItem("studentToken", data.token);

        sessionStorage.setItem(
          "studentData",
          JSON.stringify(data.student)
        );

        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";

        window.location.replace("dashboard.html");

      } catch (error) {

        message.style.color = "red";
        message.textContent = error.message;

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    });

  </script>

</body>
</html>
